name: VitaSurf POC build
on:
  workflow_dispatch:
  push:
    branches: [ios-host]
jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch QuickJS source for native JS test
        run: |
          mkdir -p vendor
          git clone --depth 1 https://github.com/bellard/quickjs.git vendor/quickjs
      - name: Patch QuickJS for Vita libc
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vendor/quickjs/quickjs.c')
          s=p.read_text()
          old='return malloc_usable_size((void *)ptr);'
          if old not in s:
              raise RuntimeError('QuickJS malloc implementation changed')
          s=s.replace(old, 'return 0; /* Vita libc lacks malloc_usable_size; QuickJS tracks requested sizes separately */')
          old='res = -tm.tm_gmtoff / 60;'
          if old not in s:
              raise RuntimeError('QuickJS timezone implementation changed')
          s=s.replace(old, 'res = 0; /* Vita fallback: UTC until timezone support is implemented */')
          # QuickJS unconditionally enables Atomics on non-Emscripten targets.
          # VitaSDK does not expose the required pthread primitives.
          atomics='#define CONFIG_ATOMICS'
          if s.count(atomics) != 1:
              raise RuntimeError('Unexpected QuickJS Atomics definition')
          s=s.replace(atomics, '/* VitaSurf: omit threaded Atomics support */')
          call='js_atomics_free_waiters(rt);'
          if s.count(call)!=1:
              raise RuntimeError('QuickJS cleanup call changed')
          s=s.replace(call, '(void)rt; /* atomics disabled */')
          p.write_text(s)
          PY
      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake"
      - name: Build
        run: cmake --build build --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: VitaSurf-POC
          path: build/*.vpk
          if-no-files-found: error
