name: Build touchHLE

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]
  create:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-osx:
    runs-on: macos-latest
    steps:
      - name: Checkout touchHLE fork
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          git clone https://github.com/j92580498-max/touchHLE "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git fetch origin "$GITHUB_REF"
          git checkout "$GITHUB_SHA"

      - name: Install clang-format
        run: brew install clang-format

      - name: Check formatting
        run: dev-scripts/format.sh --check

      - name: Initialize Submodules
        run: git submodule update --init

      - name: Install Boost
        run: brew install boost

      - name: Cache CMake
        id: cache-cmake
        uses: actions/cache@v3
        with:
          path: vendor/cmake
          key: cmake_3_31_6_macos

      - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
        name: Download & Extract CMake
        run: |
          curl -L -O "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz"
          tar xzvf cmake-3.31.6-macos-universal.tar.gz -C vendor
          mv vendor/cmake-3.31.6-macos-universal/CMake.app/Contents/ vendor/cmake
          rm -rf cmake-3.31.6-macos-universal.tar.gz

      - name: Lint
        run: dev-scripts/lint.sh
        env:
          CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v3
        with:
          path: tests/llvm
          key: llvm_12_0_0_macOS_x64

      - if: ${{ steps.cache-llvm.outputs.cache-hit != 'true' }}
        name: Download & Extract LLVM
        run: |
          curl -L -O "https://github.com/llvm/llvm-project/releases/download/llvmorg-12.0.0/clang+llvm-12.0.0-x86_64-apple-darwin.tar.xz"
          tar -xf clang+llvm-12.0.0-x86_64-apple-darwin.tar.xz
          mkdir -p tests/llvm
          mv clang+llvm-12.0.0-x86_64-apple-darwin/* tests/llvm

      - name: Get common SDK
        run: cd ${{ github.workspace }}/tests && curl -L https://github.com/touchHLE/common-3.0-sdk/releases/latest/download/common-3.0.sdk-macOS-universal.tar.gz | tar xzv

      - name: Install Rust target
        run: rustup target add x86_64-apple-darwin

      - name: Run Tests
        run: cargo test --target x86_64-apple-darwin
        env:
          CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake

      - name: Sanity check tests
        run: cc tests/TestApp_source/cli_tests.m tests/TestApp_source/CGAffineTransform.c tests/TestApp_source/SyncTester.m tests/TestApp_source/RespondsToSelector.m -framework CoreFoundation -framework Foundation -framework CoreGraphics -DDEFINE_ME_WHEN_BUILDING_ON_MACOS -DTestApp_cli_tests_main=main -ObjC && ./a.out

      - name: Build Release
        run: cargo build --target x86_64-apple-darwin --release
        env:
          CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake

      - name: Create macOS Bundle & DMG
        run: |
          cd dev-scripts
          ./make-macos-bundle.sh ../target/x86_64-apple-darwin/release/touchHLE "`cargo run --package touchHLE_version`" "`cargo run --package touchHLE_version -- --branding`"
          mkdir touchHLE-dmg-src
          mv *.app touchHLE-dmg-src/
          hdiutil create -volname touchHLE -srcfolder touchHLE-dmg-src touchHLE.dmg
          mv touchHLE.dmg ..

      - uses: actions/upload-artifact@v4
        with:
          name: touchHLE_macOS_x86_64
          path: touchHLE.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: TestApp_built_on_macOS
          path: tests/TestApp.app
