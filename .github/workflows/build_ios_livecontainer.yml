name: Build Applesauce LiveContainer IPA

on:
  push:
    branches:
      - ios-host
    paths:
      - .github/workflows/build_ios_livecontainer.yml
  workflow_dispatch:

jobs:
  build-ios-livecontainer:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch for LiveContainer
        run: python3 platform/ios/scripts/patch-livecontainer.py

      - name: Install build tools
        run: |
          brew install ninja cmake
          rustup target add aarch64-apple-ios

      - name: Prepare Boost
        run: |
          set -e
          curl -fL --retry 4 --retry-delay 2 -o boost_1_81_0.tar.gz https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz
          mkdir -p vendor
          tar xzf boost_1_81_0.tar.gz -C vendor
          rm -rf vendor/boost
          mv vendor/boost_1_81_0 vendor/boost

      - name: Build SDL2
        run: sh platform/ios/scripts/build-sdl-shared.sh iphoneos

      - name: Build Applesauce
        run: sh platform/ios/scripts/build-host.sh iphoneos Release

      - name: Mark LiveContainer build
        run: |
          set -e
          APP="build/host-iphoneos/Build/Products/Release-iphoneos/Applesauce.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Applesauce LC Debug" "$APP/Info.plist"
          printf '%s\n' \
            'Applesauce LiveContainer diagnostic build' \
            'Runtime logs: Settings > Developer Tools > Runtime Log.' \
            > "$APP/LIVECONTAINER.txt"

      - name: Package IPA
        run: sh platform/ios/scripts/package-ipa.sh dist/Applesauce-LiveContainer-Debug.ipa

      - name: Verify IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA="dist/Applesauce-LiveContainer-Debug.ipa"
          VERIFY_DIR="/tmp/applesauce-lc-verify"

          test -s "$IPA"
          unzip -tq "$IPA" >/dev/null

          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$IPA" -d "$VERIFY_DIR"

          APP="$VERIFY_DIR/Payload/Applesauce.app"
          BIN="$APP/Applesauce"
          PLIST="$APP/Info.plist"
          MARKER="$APP/LIVECONTAINER.txt"

          test -d "$APP"
          test -f "$BIN"
          test -f "$PLIST"
          test -f "$MARKER"
          test -x "$BIN"

          file "$BIN" | grep -q "Mach-O"
          file "$BIN" | grep -q "arm64"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST")

          test "$BUNDLE_ID" = "io.github.johnny901901901.applesauce"
          test "$DISPLAY_NAME" = "Applesauce LC Debug"
          grep -Fq "Applesauce LiveContainer diagnostic build" "$MARKER"
          grep -Fq "Runtime logs: Settings > Developer Tools > Runtime Log." "$MARKER"

          echo "IPA structure verified"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Display name: $DISPLAY_NAME"
          file "$BIN"

          shasum -a 256 "$IPA" | tee "$IPA.sha256"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Applesauce-LiveContainer-Debug-IPA
          path: |
            dist/Applesauce-LiveContainer-Debug.ipa
            dist/Applesauce-LiveContainer-Debug.ipa.sha256
          if-no-files-found: error
          retention-days: 7
