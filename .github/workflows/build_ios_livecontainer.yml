name: Build Applesauce LiveContainer IPA

on:
  push:
    branches: ["ios-host"]
    paths:
      - ".github/workflows/build_ios_livecontainer.yml"
  workflow_dispatch:

jobs:
  build-ios-livecontainer:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch JIT behavior for LiveContainer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("platform/ios/Sources/NativeHost.swift")
          s = p.read_text()

          # LiveContainer owns the real process. Applesauce must only CHECK
          # whether JIT is already available; it must never ask StikDebug itself.
          pattern = re.compile(
              r"    static var current: JITMethod \{\n"
              r".*?"
              r"\n    \}\n\n"
              r"    /// Shown when a launch is held back because JIT is off\.",
              re.S,
          )
          replacement = '''    static var current: JITMethod {
              // LiveContainer grants JIT to its host process before this guest starts.
              // Debugger-provided JIT is valid here because Applesauce is running
              // inside that already-JIT-enabled process.
              if touchhle_ios_jit_available() {
                  return .permanent
              }
              // Never launch StikDebug from the guest. LiveContainer owns JIT setup.
              return .external
          }

          /// Shown when a launch is held back because JIT is off.'''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f"Expected one JITMethod.current block, replaced {count}")

          s = s.replace(
              'return "Games need JIT, and without it Applesauce closes the moment one starts. "\n'
              '                + "Enable JIT for Applesauce in TrollStore, or with AltJIT, then start the "\n'
              '                + "game again."',
              'return "Games need JIT. Enable Launch with JIT for Applesauce in LiveContainer, "\n'
              '                + "then relaunch it before starting a game."',
              1,
          )

          s = s.replace(
              'return "This install has permanent JIT, so there is nothing to enable."',
              'return "JIT is already active for this LiveContainer session."',
              1,
          )
          s = s.replace(
              'return "StikDebug needs iOS 17.4 or newer. Enable JIT for Applesauce in TrollStore, "\n'
              '                + "or with AltJIT, each time it starts as a new app process."',
              'return "LiveContainer JIT is not active. Enable Launch with JIT for Applesauce "\n'
              '                + "in LiveContainer and relaunch it."',
              1,
          )

          p.write_text(s)
          PY

          echo "--- LiveContainer JIT patch verification ---"
          grep -n -A14 -B2 'static var current: JITMethod' platform/ios/Sources/NativeHost.swift

          python3 - <<'PY'
          from pathlib import Path
          s = Path('platform/ios/Sources/NativeHost.swift').read_text()
          block = s.split('static var current: JITMethod', 1)[1].split('/// Shown when a launch', 1)[0]
          if 'return .stikDebug' in block:
              raise SystemExit('ERROR: LiveContainer build still selects in-app StikDebug')
          if 'if touchhle_ios_jit_available()' not in block:
              raise SystemExit('ERROR: LiveContainer build does not accept host-provided JIT')
          print('Verified: guest only checks host-provided JIT and never requests it.')
          PY

      - name: Install build tools
        run: |
          brew install ninja cmake
          rustup target add aarch64-apple-ios

      - name: Prepare Boost
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 -o boost_1_81_0.tar.gz https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz
          mkdir -p vendor
          tar xzf boost_1_81_0.tar.gz -C vendor
          rm -rf vendor/boost
          mv vendor/boost_1_81_0 vendor/boost

      - name: Build shared SDL2 for iPhoneOS
        run: sh platform/ios/scripts/build-sdl-shared.sh iphoneos

      - name: Build Applesauce for iPhoneOS
        run: sh platform/ios/scripts/build-host.sh iphoneos Release

      - name: Add LiveContainer build marker
        shell: bash
        run: |
          set -euo pipefail
          APP="build/host-iphoneos/Build/Products/Release-iphoneos/Applesauce.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Applesauce LC' "$APP/Info.plist"
          cat > "$APP/LIVECONTAINER.txt" <<'EOF'
          Applesauce LiveContainer build
          JIT is granted by LiveContainer before Applesauce starts.
          Applesauce intentionally does not contact StikDebug itself.
          EOF

      - name: Package unsigned LiveContainer IPA
        run: sh platform/ios/scripts/package-ipa.sh dist/Applesauce-LiveContainer.ipa

      - name: Verify LiveContainer IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA="dist/Applesauce-LiveContainer.ipa"
          test -s "$IPA"
          unzip -tq "$IPA" >/dev/null
          rm -rf /tmp/applesauce-lc-verify
          mkdir -p /tmp/applesauce-lc-verify
          unzip -q "$IPA" -d /tmp/applesauce-lc-verify
          APP="/tmp/applesauce-lc-verify/Payload/Applesauce.app"
          test -d "$APP"
          test -f "$APP/Applesauce"
          test -f "$APP/LIVECONTAINER.txt"
          file "$APP/Applesauce" | grep -q 'arm64'
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")
          test "$BUNDLE_ID" = "io.github.johnny901901901.applesauce"
          test "$DISPLAY_NAME" = "Applesauce LC"
          strings "$APP/Applesauce" | grep -Fq 'LiveContainer JIT is not active.'
          strings "$APP/Applesauce" | grep -Fq 'JIT is already active for this LiveContainer session.'
          echo "Verified LiveContainer IPA: $IPA"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Display name: $DISPLAY_NAME"
          shasum -a 256 "$IPA" | tee "$IPA.sha256"

      - name: Upload LiveContainer IPA
        uses: actions/upload-artifact@v4
        with:
          name: Applesauce-LiveContainer-IPA
          path: |
            dist/Applesauce-LiveContainer.ipa
            dist/Applesauce-LiveContainer.ipa.sha256
          if-no-files-found: error
          retention-days: 7
