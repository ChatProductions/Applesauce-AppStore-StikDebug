name: Build Applesauce LiveContainer IPA

on:
  push:
    branches:
      - ios-host
    paths:
      - .github/workflows/build_ios_livecontainer.yml
  workflow_dispatch:

jobs:
  build-ios-livecontainer:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch for LiveContainer
        run: python3 platform/ios/scripts/patch-livecontainer.py

      - name: Install build tools
        run: |
          brew install ninja cmake
          rustup target add aarch64-apple-ios

      - name: Prepare Boost
        run: |
          set -e
          curl -fL --retry 4 --retry-delay 2 -o boost_1_81_0.tar.gz https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz
          mkdir -p vendor
          tar xzf boost_1_81_0.tar.gz -C vendor
          rm -rf vendor/boost
          mv vendor/boost_1_81_0 vendor/boost

      - name: Build SDL2
        run: sh platform/ios/scripts/build-sdl-shared.sh iphoneos

      - name: Build Applesauce
        run: sh platform/ios/scripts/build-host.sh iphoneos Release

      - name: Mark LiveContainer build
        run: |
          APP="build/host-iphoneos/Build/Products/Release-iphoneos/Applesauce.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Applesauce LC Debug" "$APP/Info.plist"
          printf '%s\n' 'Applesauce LiveContainer diagnostic build' 'Runtime logs: Settings > Developer Tools > Runtime Log.' > "$APP/LIVECONTAINER.txt"

      - name: Package IPA
        run: sh platform/ios/scripts/package-ipa.sh dist/Applesauce-LiveContainer-Debug.ipa

      - name: Verify IPA
        run: |
          set -e
          IPA="dist/Applesauce-LiveContainer-Debug.ipa"
          test -s "$IPA"
          unzip -tq "$IPA" >/dev/null
          rm -rf /tmp/applesauce-lc-verify
          mkdir -p /tmp/applesauce-lc-verify
          unzip -q "$IPA" -d /tmp/applesauce-lc-verify
          APP="/tmp/applesauce-lc-verify/Payload/Applesauce.app"
          test -f "$APP/Applesauce"
          test -f "$APP/LIVECONTAINER.txt"
          file "$APP/Applesauce" | grep -q arm64
          strings "$APP/Applesauce" | grep -Fq "Runtime Log"
          strings "$APP/Applesauce" | grep -Fq "JIT is not active in this LiveContainer session."
          shasum -a 256 "$IPA" | tee "$IPA.sha256"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Applesauce-LiveContainer-Debug-IPA
          path: |
            dist/Applesauce-LiveContainer-Debug.ipa
            dist/Applesauce-LiveContainer-Debug.ipa.sha256
          if-no-files-found: error
          retention-days: 7
