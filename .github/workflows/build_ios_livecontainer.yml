name: Build Applesauce LiveContainer App

on:
  push:
    branches:
      - ios-host
    paths:
      - .github/workflows/build_ios_livecontainer.yml
      - platform/ios/scripts/patch-livecontainer.py
      - platform/ios/scripts/patch-runtime-diagnostics.py
  workflow_dispatch:

jobs:
  build-ios-livecontainer:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch for LiveContainer
        run: |
          set -e
          python3 platform/ios/scripts/patch-livecontainer.py
          python3 platform/ios/scripts/patch-runtime-diagnostics.py

      - name: Install build tools
        run: |
          brew install ninja cmake
          rustup target add aarch64-apple-ios

      - name: Prepare Boost
        run: |
          set -e
          curl -fL --retry 4 --retry-delay 2 -o boost_1_81_0.tar.gz https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz
          mkdir -p vendor
          tar xzf boost_1_81_0.tar.gz -C vendor
          rm -rf vendor/boost
          mv vendor/boost_1_81_0 vendor/boost

      - name: Build SDL2
        run: sh platform/ios/scripts/build-sdl-shared.sh iphoneos

      - name: Build Applesauce
        run: sh platform/ios/scripts/build-host.sh iphoneos Release

      - name: Mark LiveContainer build
        run: |
          set -e
          APP="build/host-iphoneos/Build/Products/Release-iphoneos/Applesauce.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Applesauce LC Debug" "$APP/Info.plist"
          printf '%s\n' \
            'Applesauce LiveContainer diagnostic build' \
            'Runtime logs: Settings > Developer Tools > Runtime Log.' \
            'Diagnostic checkpoints: LC-DIAG 10 through 51.' \
            > "$APP/LIVECONTAINER.txt"

      - name: Package app bundle
        run: |
          set -e
          mkdir -p dist
          APP="build/host-iphoneos/Build/Products/Release-iphoneos/Applesauce.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/Applesauce-LiveContainer-Debug.app.zip

      - name: Verify app bundle
        shell: bash
        run: |
          set -euo pipefail
          ZIP="dist/Applesauce-LiveContainer-Debug.app.zip"
          VERIFY_DIR="/tmp/applesauce-lc-app-verify"

          test -s "$ZIP"
          unzip -tq "$ZIP" >/dev/null
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$ZIP" -d "$VERIFY_DIR"

          APP="$VERIFY_DIR/Applesauce.app"
          BIN="$APP/Applesauce"
          PLIST="$APP/Info.plist"
          MARKER="$APP/LIVECONTAINER.txt"

          test -d "$APP"
          test -f "$BIN"
          test -x "$BIN"
          test -f "$PLIST"
          test -f "$MARKER"
          file "$BIN" | grep -q "Mach-O"
          file "$BIN" | grep -q "arm64"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST")
          test "$BUNDLE_ID" = "io.github.johnny901901901.applesauce"
          test "$DISPLAY_NAME" = "Applesauce LC Debug"
          grep -Fq "Diagnostic checkpoints: LC-DIAG 10 through 51." "$MARKER"

          echo "App bundle verified"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Display name: $DISPLAY_NAME"
          file "$BIN"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Applesauce-LiveContainer-Debug-App
          path: |
            dist/Applesauce-LiveContainer-Debug.app.zip
            dist/Applesauce-LiveContainer-Debug.app.zip.sha256
          if-no-files-found: error
          retention-days: 7
